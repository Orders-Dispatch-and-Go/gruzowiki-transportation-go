services:
  transportation_db_postgres:
    image: 'postgres:16.4'
    container_name: "transportation-postgres"
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRANSPORTATION_PG_USER} -d ${TRANSPORTATION_PG_DATABASE} -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gruzowiki_network

  transportation_flyway:
    image: 'flyway/flyway:11.4'
    container_name: "transportation-flyway"
    env_file:
      - .env
    environment:
      FLYWAY_URL: jdbc:postgresql://transportation_db_postgres:5432/postgres
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: postgres
    command:
      - migrate
    volumes:
      - ./db/pg/migrations:/flyway/sql
    depends_on:
      transportation_db_postgres:
        condition: service_started
        restart: true
    networks:
      - gruzowiki_network

networks:
  gruzowiki_network:
    name: "gruzowiki-network"
    driver: bridge
    external: true